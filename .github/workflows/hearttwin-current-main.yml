name: HeartTwin current-main integration

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "11 5 * * *"

permissions:
  contents: read

concurrency:
  group: hearttwin-current-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-main:
    name: Python ${{ matrix.python-version }} · live component mains
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      HEARTTWIN_REQUIRE_NATIVE: "1"
      HEARTTWIN_CURRENT_MAIN: "1"

    steps:
      - name: Checkout HeartTwin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install HeartTwin
        run: python -m pip install -e '.[dev]'

      - name: Install live Virelion component mains
        run: python -m pip install --no-cache-dir -r requirements-services-main.txt

      - name: Validate live registry
        run: hearttwin doctor

      - name: Run complete live-stack suite
        run: python -m pytest -q

      - name: Run mechanistic continuity canary explicitly
        run: python -m pytest -q tests/test_mechanistic_pipe.py

      - name: Run single-subject superstack canary explicitly
        run: python -m pytest -q tests/test_superstack_continuity.py
