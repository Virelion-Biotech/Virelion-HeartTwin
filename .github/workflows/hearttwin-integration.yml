name: HeartTwin integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  integration:
    name: Python ${{ matrix.python-version }} · full Virelion stack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout HeartTwin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install HeartTwin
        run: python -m pip install -e '.[dev]'

      - name: Install pinned compatibility stack
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          lock = json.loads(Path("configs/compatibility-lock.json").read_text())
          repositories = lock.get("repositories", [])
          if not repositories:
              raise SystemExit("compatibility lock contains no repositories")

          seen = set()
          for item in repositories:
              name = item["name"]
              sha = item["sha"]
              if name in seen:
                  raise SystemExit(f"duplicate compatibility-lock repository: {name}")
              seen.add(name)
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(f"compatibility lock for {name} is not an exact commit SHA: {sha}")
              subprocess.check_call([
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  f"git+https://github.com/Virelion-Biotech/{name}.git@{sha}",
              ])
          PY

      - name: Validate registry
        env:
          HEARTTWIN_REQUIRE_NATIVE: "1"
        run: |
          hearttwin doctor
          python - <<'PY'
          import json
          import subprocess
          doctor = json.loads(subprocess.check_output(["hearttwin", "doctor"], text=True))
          required = [
              "CardiAtlas", "CardiBench", "CardiEval", "CardiLearn",
              "CardiSim", "CardiVex", "CardiStudio", "DCCP",
          ]
          missing = [name for name in required if not doctor.get(name)]
          if missing:
              raise SystemExit(f"Native services unavailable after installation: {missing}")
          PY

      - name: Run HeartTwin integration tests
        env:
          HEARTTWIN_REQUIRE_NATIVE: "1"
        run: python -m pytest -q tests/test_native_service_connections.py tests/test_multimodal_workflow.py

      - name: Run full HeartTwin test suite
        env:
          HEARTTWIN_REQUIRE_NATIVE: "1"
        run: python -m pytest -q


  current-head:
    name: Python 3.11 · current repository heads
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HeartTwin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install HeartTwin
        run: python -m pip install -e '.[dev]'

      - name: Install current Virelion repository heads
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          lock = json.loads(Path("configs/compatibility-lock.json").read_text())
          for item in lock["repositories"]:
              name = item["name"]
              subprocess.check_call([
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  f"git+https://github.com/Virelion-Biotech/{name}.git@main",
              ])
          PY

      - name: Run current-head integration contract
        env:
          HEARTTWIN_REQUIRE_NATIVE: "1"
        run: |
          hearttwin doctor
          python -m pytest -q tests/test_native_service_connections.py tests/test_multimodal_workflow.py
