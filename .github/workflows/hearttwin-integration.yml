name: HeartTwin integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Python ${{ matrix.python-version }} · full Virelion stack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout HeartTwin
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install HeartTwin
        run: python -m pip install -e '.[dev]'

      - name: Install native service repositories
        run: |
          set -euxo pipefail
          repos=(
            Virelion-CardiAtlas
            Virelion-CardiBench
            Virelion-CardiEval
            Virelion-CardiLearn
            Virelion-CardiSim
            Virelion-CardiVex
            Virelion-CardiStudio
            Virelion-DCCP
          )
          for repo in "${repos[@]}"; do
            python -m pip install "git+https://github.com/Virelion-Biotech/${repo}.git@main"
          done

      - name: Install adapter repositories
        run: |
          set -euxo pipefail
          repos=(
            Virelion-ElectroTrace
            Virelion-MyoTrace
            Virelion-OptiCell
            Virelion-CardioScore
            Virelion-CardiTrace
            Virelion-CardiBridge
            Virelion-CardiAgent
          )
          for repo in "${repos[@]}"; do
            python -m pip install "git+https://github.com/Virelion-Biotech/${repo}.git@main"
          done

      - name: Validate registry
        env:
          HEARTTWIN_REQUIRE_NATIVE: "1"
        run: |
          hearttwin doctor
          python - <<'PY'
          import json
          import subprocess
          doctor = json.loads(subprocess.check_output(["hearttwin", "doctor"], text=True))
          required = [
              "CardiAtlas", "CardiBench", "CardiEval", "CardiLearn",
              "CardiSim", "CardiVex", "CardiStudio", "DCCP",
          ]
          missing = [name for name in required if not doctor.get(name)]
          if missing:
              raise SystemExit(f"Native services unavailable after installation: {missing}")
          PY

      - name: Run HeartTwin integration tests
        env:
          HEARTTWIN_REQUIRE_NATIVE: "1"
        run: python -m pytest -q tests/test_native_service_connections.py tests/test_multimodal_workflow.py

      - name: Run full HeartTwin test suite
        env:
          HEARTTWIN_REQUIRE_NATIVE: "1"
        run: python -m pytest -q
