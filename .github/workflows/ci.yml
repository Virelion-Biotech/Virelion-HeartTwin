name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hearttwin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q hearttwin tests
      - run: ruff check hearttwin/argo_readiness.py tests/test_argo_readiness.py hearttwin/web.py hearttwin/web_job.py tests/test_web_workbench.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check hearttwin/webui/app.js && node --check hearttwin/webui/viewer.js
      - run: node --test tests/webui_geometry.test.cjs
      - run: pytest -q
      - run: hearttwin doctor
