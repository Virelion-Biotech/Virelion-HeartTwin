name: Zenodo metadata probe

on:
  push:
    branches:
      - diagnostic/zenodo-metadata

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: List Zenodo files
        run: |
          python - <<'PY'
          import json
          import urllib.request
          url = "https://zenodo.org/api/records/14034739"
          with urllib.request.urlopen(url, timeout=60) as response:
              record = json.loads(response.read().decode("utf-8"))
          print("TITLE", record.get("metadata", {}).get("title"))
          print("FILE_COUNT", len(record.get("files", [])))
          print("TOTAL_BYTES", sum(int(item.get("size") or 0) for item in record.get("files", [])))
          for item in record.get("files", []):
              print(json.dumps({
                  "key": item.get("key") or item.get("filename"),
                  "size": item.get("size"),
                  "checksum": item.get("checksum"),
                  "links": item.get("links", {}),
              }, sort_keys=True))
          PY

      - name: Probe tar range support
        run: |
          python - <<'PY'
          import json
          import urllib.request
          record = json.loads(urllib.request.urlopen("https://zenodo.org/api/records/14034739", timeout=60).read())
          item = next(x for x in record["files"] if (x.get("key") or x.get("filename")) == "meta_data.tar")
          links = item.get("links", {})
          url = links.get("content") or links.get("self")
          print("DOWNLOAD_URL", url)
          req = urllib.request.Request(url, headers={"Range": "bytes=0-1023"})
          with urllib.request.urlopen(req, timeout=60) as response:
              data = response.read()
              print("RANGE_STATUS", getattr(response, "status", None))
              print("RANGE_LEN", len(data))
              print("CONTENT_RANGE", response.headers.get("Content-Range"))
              print("ACCEPT_RANGES", response.headers.get("Accept-Ranges"))
              print("FIRST_100", data[:100])
          PY
