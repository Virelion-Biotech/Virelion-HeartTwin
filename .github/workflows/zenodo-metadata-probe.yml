name: Zenodo metadata probe

on:
  push:
    branches:
      - diagnostic/zenodo-metadata

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: List Zenodo files
        run: |
          python - <<'PY'
          import json
          import urllib.request
          url = "https://zenodo.org/api/records/14034739"
          with urllib.request.urlopen(url, timeout=60) as response:
              record = json.loads(response.read().decode("utf-8"))
          print("TITLE", record.get("metadata", {}).get("title"))
          print("FILE_COUNT", len(record.get("files", [])))
          print("TOTAL_BYTES", sum(int(item.get("size") or 0) for item in record.get("files", [])))
          for item in record.get("files", []):
              print(json.dumps({
                  "key": item.get("key") or item.get("filename"),
                  "size": item.get("size"),
                  "checksum": item.get("checksum"),
                  "content": item.get("links", {}).get("content"),
              }, sort_keys=True))
          PY
