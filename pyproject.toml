[project]
name = "virelion-hearttwin"
version = "0.1.0"
description = "Unified orchestration and cardiac digital-twin gateway for the Virelion ecosystem"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hearttwin = "hearttwin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hearttwin*"]
